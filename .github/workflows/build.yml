name: Build Seal APK

# Builds Seal with a bundled QuickJS JavaScript runtime so that yt-dlp can
# solve YouTube's EJS challenges again.
#
# The QuickJS binary is cross-compiled here for every ABI Seal ships, because
# the repository intentionally does not commit prebuilt binaries.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner image already ships ANDROID_HOME with cmdline-tools, so no
      # setup action is needed here - only install the components Seal needs.
      - name: Prepare Android SDK (NDK + CMake)
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=sdkmanager
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          if [ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            "$SDKMANAGER" --install "ndk;27.0.12077973"
          fi
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            "$SDKMANAGER" --install "cmake;3.22.1"
          fi
          echo "--- NDK versions ---"
          ls -1 "$ANDROID_HOME/ndk" || true
          echo "--- CMake versions ---"
          ls -1 "$ANDROID_HOME/cmake" || true

      - name: Build QuickJS for Android
        run: bash scripts/build-quickjs.sh

      - name: Build debug APK
        run: |
          chmod +x gradlew
          # Safety net: a CRLF gradlew fails with "/usr/bin/env: 'sh\r'".
          sed -i 's/\r$//' gradlew
          ./gradlew --no-daemon assembleGenericDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: seal-debug-apk
          path: app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error
