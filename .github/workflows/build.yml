name: Build Seal APK

# Builds Seal with a bundled QuickJS JavaScript runtime so that yt-dlp can
# solve YouTube's EJS challenges again.
#
# The QuickJS binary is cross-compiled here for every ABI Seal ships, because
# the repository intentionally does not commit prebuilt binaries. The latest
# stable yt-dlp is downloaded here as well and shipped as an asset, since the
# copy inside youtubedl-android (2024.09.27) predates the EJS mechanism.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle mints a fresh debug key on any machine that does not have one, so
      # without a committed keystore every run signed differently and the new APK
      # could only be installed after uninstalling the previous one. The key is
      # created once and committed back so all later runs share it.
      - name: Ensure stable debug keystore
        run: |
          set -e
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore -storetype PKCS12 \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Seal Debug, OU=Seal, O=Seal, L=Unknown, ST=Unknown, C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Add a fixed debug keystore so builds share one signature [skip ci]"
            git push
            echo "created and committed a new debug keystore"
          fi
          keytool -list -v -keystore debug.keystore -storepass android \
            | grep -E "Alias name|SHA1" | head -2

      # The upstream library bundles yt-dlp 2024.09.27, which has no --js-runtimes
      # support, so a modern build is fetched here and shipped as an asset.
      - name: Fetch latest stable yt-dlp
        run: |
          set -e
          mkdir -p app/src/main/assets
          VERSION=$(curl -fsSL https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest \
            | grep -m1 '"tag_name"' \
            | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "could not determine the latest yt-dlp version" >&2
            exit 1
          fi
          echo "latest stable yt-dlp: $VERSION"
          curl -fsSL -o app/src/main/assets/ytdlp \
            "https://github.com/yt-dlp/yt-dlp/releases/download/$VERSION/yt-dlp"
          printf '%s' "$VERSION" > app/src/main/assets/ytdlp.version
          ls -l app/src/main/assets/

      # Confirms the download really is a usable zipapp, and records whether the
      # yt-dlp-ejs solver ships inside it (otherwise --remote-components would be
      # needed, which is fragile behind restricted networks).
      - name: Inspect bundled yt-dlp
        run: |
          python3 - <<'PY'
          import zipfile

          z = zipfile.ZipFile('app/src/main/assets/ytdlp')
          names = z.namelist()
          print('entries:', len(names))
          if 'yt_dlp/version.py' in names:
              head = z.read('yt_dlp/version.py').decode('utf-8', 'replace')
              for line in head.splitlines():
                  if '__version__' in line:
                      print('version:', line.strip())
          print('has jsc provider:', any('/jsc/' in n for n in names))
          print('js runtime files:', [n for n in names if 'jsruntime' in n])
          print('ejs mentions:', sorted({n for n in names if 'ejs' in n.lower()})[:10])
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner image already ships ANDROID_HOME with cmdline-tools, so no
      # setup action is needed here - only install the components Seal needs.
      - name: Prepare Android SDK (NDK + CMake)
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=sdkmanager
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          if [ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            "$SDKMANAGER" --install "ndk;27.0.12077973"
          fi
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            "$SDKMANAGER" --install "cmake;3.22.1"
          fi
          echo "--- NDK versions ---"
          ls -1 "$ANDROID_HOME/ndk" || true
          echo "--- CMake versions ---"
          ls -1 "$ANDROID_HOME/cmake" || true

      - name: Build QuickJS for Android
        run: bash scripts/build-quickjs.sh

      - name: Build debug APK
        run: |
          chmod +x gradlew
          # Safety net: a CRLF gradlew fails with "/usr/bin/env: 'sh\r'".
          sed -i 's/\r$//' gradlew
          # Every build otherwise reports the same version, so a device cannot
          # tell them apart and bug reports are impossible to attribute.
          sed -i 's|versionNameSuffix = "-debug"|versionNameSuffix = "-debug-b${{ github.run_number }}"|' app/build.gradle.kts
          ./gradlew --no-daemon assembleGenericDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: seal-debug-apk
          path: app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error

      # Release assets stay downloadable without a GitHub account and do not
      # expire, unlike workflow artifacts. Only published for manual runs so
      # that ordinary commits do not spam the releases page.
      - name: Publish APKs to a GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="build-${{ github.run_number }}"
          YTDLP_VERSION=$(cat app/src/main/assets/ytdlp.version)
          cat > notes.md <<EOF
          Seal with a bundled QuickJS JavaScript runtime and a bundled stable yt-dlp
          ($YTDLP_VERSION).

          Upstream Seal has been unmaintained since 2024 and cannot download from
          YouTube any more: yt-dlp requires an external JavaScript runtime since
          2025.11.12 to solve YouTube's EJS challenges.

          - QuickJS (quickjs-ng v0.17.0) is cross-compiled and shipped as
            \`libqjs.so\`, and passed to yt-dlp via \`--js-runtimes\`.
          - yt-dlp $YTDLP_VERSION is bundled, so the app works on first launch
            instead of needing a network update first. The in-app updater can
            still fetch newer releases afterwards.

          Debug build: package \`com.junkfood.seal.debug\`, installs alongside the
          official Seal release. Install the arm64-v8a APK on modern phones.
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Seal + QuickJS (build ${{ github.run_number }})" \
            --notes-file notes.md \
            app/build/outputs/apk/generic/debug/*.apk
          echo "https://github.com/$GITHUB_REPOSITORY/releases/latest" >> "$GITHUB_STEP_SUMMARY"
